<svg xmlns="http://www.w3.org/2000/svg" width="800" height="344" viewBox="0 0 800 344" role="img" aria-labelledby="title desc">
  <title id="title">C# throughput as a percentage of C++</title>
  <desc id="desc">Networking only 99.6 percent. EASY JSON, keep records 98.5 percent. EASY JSON, check and total 95.1 percent. HARD JSON, keep records in fresh memory 76.7 percent. HARD JSON, keep records 75.7 percent. HARD JSON, check and total 70.2 percent.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .t { fill: #1f2328; }
    .s { fill: #59636e; }
    .grid { stroke: #d1d9e0; stroke-width: 1; }
    .ref { stroke: #59636e; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .bar { fill: #2a78d6; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #f0f6fc; }
      .s { fill: #9198a1; }
      .grid { stroke: #3d444d; }
      .ref { stroke: #9198a1; }
      .bar { fill: #3987e5; }
    }
  </style>

  <text class="t" x="24" y="30" font-size="19" font-weight="600">How fast is C# compared to C++?</text>
  <text class="s" x="24" y="52" font-size="13">Records per second, C# as a percentage of C++. Same machine, same data, same rules.</text>

  <!-- grid: 0% at x=280, 100% at x=700 -->
  <line class="grid" x1="280" y1="72" x2="280" y2="290"/>
  <line class="grid" x1="385" y1="72" x2="385" y2="290"/>
  <line class="grid" x1="490" y1="72" x2="490" y2="290"/>
  <line class="grid" x1="595" y1="72" x2="595" y2="290"/>
  <text class="s" x="280" y="306" font-size="12" text-anchor="middle">0%</text>
  <text class="s" x="385" y="306" font-size="12" text-anchor="middle">25%</text>
  <text class="s" x="490" y="306" font-size="12" text-anchor="middle">50%</text>
  <text class="s" x="595" y="306" font-size="12" text-anchor="middle">75%</text>
  <text class="s" x="700" y="306" font-size="12" text-anchor="middle">100%</text>

  <!-- bars: square at the baseline, 4px rounded data end -->
  <text class="t" x="268" y="92" font-size="13" text-anchor="end">Networking only (no JSON)</text>
  <path class="bar" d="M280,78 h414.3 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-414.3 z"/>
  <text class="t" x="706" y="92" font-size="13" font-weight="600">99.6%</text>

  <text class="t" x="268" y="126" font-size="13" text-anchor="end">EASY JSON, keep records</text>
  <path class="bar" d="M280,112 h409.7 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-409.7 z"/>
  <text class="t" x="706" y="126" font-size="13" font-weight="600">98.5%</text>

  <text class="t" x="268" y="160" font-size="13" text-anchor="end">EASY JSON, check and total</text>
  <path class="bar" d="M280,146 h395.4 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-395.4 z"/>
  <text class="t" x="706" y="160" font-size="13" font-weight="600">95.1%</text>

  <text class="t" x="268" y="208" font-size="13" text-anchor="end">HARD JSON, keep in fresh memory</text>
  <path class="bar" d="M280,194 h318.1 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-318.1 z"/>
  <text class="t" x="610" y="208" font-size="13" font-weight="600">76.7%</text>

  <text class="t" x="268" y="242" font-size="13" text-anchor="end">HARD JSON, keep records</text>
  <path class="bar" d="M280,228 h313.9 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-313.9 z"/>
  <text class="t" x="606" y="242" font-size="13" font-weight="600">75.7%</text>

  <text class="t" x="268" y="276" font-size="13" text-anchor="end">HARD JSON, check and total</text>
  <path class="bar" d="M280,262 h290.8 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-290.8 z"/>
  <text class="t" x="583" y="276" font-size="13" font-weight="600">70.2%</text>

  <!-- C++ reference -->
  <line class="ref" x1="700" y1="66" x2="700" y2="290"/>
  <text class="s" x="700" y="62" font-size="12" text-anchor="middle">C++ = 100%</text>

  <text class="s" x="24" y="334" font-size="12">Median of paired runs on a Ryzen 7 9800X3D, 4 server cores each. Longer bar = closer to C++.</text>
</svg>
